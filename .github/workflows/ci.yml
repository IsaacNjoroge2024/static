name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: ok-collab/setup-rokit@v1

      - name: Cache Wally Packages
        uses: actions/cache@v4
        with:
          path: ~/.wally/store
          key: ${{ runner.os }}-wally-${{ hashFiles('wally.toml') }}
          restore-keys: |
            ${{ runner.os }}-wally-

      - name: Install Wally Packages
        run: wally install

      - name: Download Roblox Type Definitions
        run: curl -sL https://luau-lsp.pages.dev/type-definitions/globalTypes.None.d.luau -o globalTypes.d.luau

      - name: Generate Rojo Sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json

      - name: Run Luau Static Analysis
        run: luau-lsp analyze --definitions=globalTypes.d.luau --sourcemap=sourcemap.json src

      - name: Run Selene Linter
        run: selene src

      - name: Verify Rojo Build Compilation
        run: rojo build default.project.json --output build.rbxl
